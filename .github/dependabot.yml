---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "⬆️"
    labels:
      - dependencies
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    commit-message:
      prefix: "⬆️"
    labels:
      - dependencies
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    versioning-strategy: increase
